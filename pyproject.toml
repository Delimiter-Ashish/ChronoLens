[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronolens"
version = "0.1.0"
description = "Long-video retrieval, temporal grounding, and visual evidence tracking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-contrib-python-headless>=4.10",
    "Pillow>=10,<12",
    "transformers==4.57.2",
    "faiss-cpu>=1.8",
    "gradio==5.49.1",
    "huggingface-hub>=0.34,<1.0",
    "imageio-ffmpeg>=0.6",
    "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
